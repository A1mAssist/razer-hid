[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "razer-hid"
version = "0.2.0"
description = "Razer HID protocol 2.5/3.0/64 reference client, transport table and command database"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "A1mAssist" }]
dependencies = ["hidapi>=0.14"]

[project.optional-dependencies]
ble = ["bleak>=0.22"]

[project.scripts]
razerctl = "razer_hid.cli:main"

[tool.setuptools]
packages = ["razer_hid", "razer_hid.transport", "razer_hid.payloads"]

[tool.setuptools.package-data]
razer_hid = ["data/*.json", "data/*.gz", "data/schemas/*.json"]
